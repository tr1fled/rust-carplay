[package]
name = "rust-carplay"
version = "0.1.0"
edition = "2024"

[dependencies]
mdns-sd = "0.15.1"
env_logger = "0.11.8"
log = "0.4.28"
sha2 = "0.10.9"
rand = "0.8"
num-bigint = "0.4.6"
libc = "0.2.176"
hkdf = "0.12.4"
rsa = "0.9.8"
sha1 = "0.10.6"
openssl = "0.10.73"
once_cell = "1.21.3"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
structopt = "0.3.26"
uuid = { version = "1.18.1", features = ["v4"] }
dirs = "6.0.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
threadpool = "1.8.1"
byteorder = "1.5.0"
plist = "1.8.0"
serde = { version = "1.0.228", features = ["derive"] }
gst = { package = "gstreamer", version = "0.24.3", features = ["v1_22"] }
#gst-plugin-gtk4 = "0.14.3"
gst_video = { package = "gstreamer-video", version = "0.24.3", features = ["v1_22"] }
gst_app = {package = "gstreamer-app", version = "0.24.2"}
gtk = { version = "0.10.2", package = "gtk4" }

[build-dependencies]
cc = "1.2.40"
bindgen = "0.72.1"
pkg-config = "0.3.32"

[profile.release]
debug = true
